# Dev profile: run against an in-memory H2 database so the app can be started
# instantly without installing MySQL first. Switch to the default profile
# (or set SPRING_PROFILES_ACTIVE=prod) to use real MySQL via application.yml.
spring:
  datasource:
    url: jdbc:h2:mem:caselock_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

caselock:
  seed:
    enabled: true
