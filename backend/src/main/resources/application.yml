spring:
  application:
    name: caselock-backend

  profiles:
    # No profile active by default, so the plain MySQL settings below are
    # used as-is. Set SPRING_PROFILES_ACTIVE=dev to switch to an in-memory
    # H2 database instead (see application-dev.yml), or =prod for the
    # production-hardened MySQL profile (see application-prod.yml).
    active: ${SPRING_PROFILES_ACTIVE:}

  datasource:
    url: ${DB_URL:${MYSQL_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:caselock_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
    username: ${DB_USERNAME:${MYSQLUSER:root}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:Vishal07^}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:55MB}

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

caselock:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-minimum-256-bits-required-for-hs256-signing}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}          # 24h access token
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7d refresh token
  file-storage:
    path: ${FILE_STORAGE_PATH:./uploads}
    allowed-extensions: jpg,jpeg,png,gif,bmp,tiff,mp4,mov,avi,mkv,mp3,wav,m4a,pdf,doc,docx,txt,csv,xls,xlsx,zip,rar,7z
    max-size-mb: ${MAX_FILE_SIZE_MB:50}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://caselock.vercel.app,https://*.vercel.app}
  security:
    max-failed-login-attempts: 5
    account-lockout-minutes: 15
  seed:
    # Seeds demo users/cases/evidence on first run against whichever database
    # is active (MySQL by default now), as long as the users table is empty.
    # The prod profile overrides this back to false.
    enabled: true

logging:
  level:
    root: INFO
    com.caselock: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/caselock.log}
